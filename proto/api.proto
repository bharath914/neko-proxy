syntax = "proto3";

// Client API for nekod. One WebSocket connection (binary frames) over a Unix
// domain socket. Every frame is one ClientMessage (client -> core) or one
// ServerMessage (core -> client). A response echoes the request id. Pushed
// events (FlowBatch, Resync) carry id = 0.
//
// Phase 2 adds rules (mock, map remote, rewrite, throttle, breakpoint),
// held messages (paused, resume), replay, and approvals for AI clients.
//
// Phase 1 surface: subscribe, get_flow, search, capture.start/stop/status,
// export(har), clear, plus status and ca_info for the app shell.
// Also: hosts (the host list), and the person's SSL proxying and Map Local
// rules (rules, set_ssl, ssl_host, put_map_local, remove_rule, unpin).
package neko.api.v1;

option java_package = "dev.nekoproxy.api";

// ---------------------------------------------------------------- envelope

message ClientMessage {
  uint64 id = 1;
  oneof body {
    SubscribeRequest subscribe = 10;
    UnsubscribeRequest unsubscribe = 11;
    GetFlowRequest get_flow = 12;
    SearchRequest search = 13;
    CaptureRequest capture = 14;
    ExportRequest export = 15;
    ClearRequest clear = 16;
    StatusRequest status = 17;
    CaInfoRequest ca_info = 18;
    HostsRequest hosts = 19;
    RulesRequest rules = 20;
    SetSslRequest set_ssl = 21;
    SslHostRequest ssl_host = 22;
    PutMapLocalRequest put_map_local = 23;
    RemoveRuleRequest remove_rule = 24;
    UnpinRequest unpin = 25;
    PutRuleRequest put_rule = 26;
    SetRuleEnabledRequest set_rule_enabled = 27;
    ListPausedRequest paused = 28;
    ResumeRequest resume = 29;
    ReplayRequest replay = 30;
    WatchRequest watch = 31;
    ListApprovalsRequest approvals = 32;
    DecideApprovalRequest decide_approval = 33;
    SetMcpWritesRequest set_mcp_writes = 34;
    McpInfoRequest mcp_info = 35;
    SdkStatusRequest sdk_status = 36;
    SdkSetEnabledRequest sdk_set_enabled = 37;
    DevicesSubscribeRequest devices_subscribe = 38;
    DeviceActionRequest device_action = 39;
    SetDeviceConfigRequest set_device_config = 40;
    FetchBodyRequest fetch_body = 41;
    RegenerateSdkCertRequest regenerate_sdk_cert = 42;
    SdkSetSettingsRequest sdk_set_settings = 43;
    ImportHarRequest import_har = 44;
  }
}

message ServerMessage {
  uint64 id = 1;
  oneof body {
    ErrorResponse error = 9;
    SubscribeResponse subscribed = 10;
    UnsubscribeResponse unsubscribed = 11;
    FlowDetail flow = 12;
    SearchResponse search = 13;
    CaptureStatus capture = 14;
    ExportResponse export = 15;
    ClearResponse cleared = 16;
    StatusResponse status = 17;
    CaInfo ca_info = 18;
    HostsResponse hosts = 19;
    RulesResponse rules = 20;
    PausedList paused = 21;
    ReplayResponse replay = 22;
    ApprovalsResponse approvals = 23;
    McpInfo mcp_info = 24;
    SdkStatus sdk_status = 25;
    DevicesSnapshot devices = 26;
    OkResponse ok = 27;
    ImportHarResponse imported_har = 28;
    FlowBatch batch = 30;
    Resync resync = 31;
    PauseNotice pause_notice = 32;
    ApprovalNotice approval_notice = 33;
  }
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}

// ---------------------------------------------------------------- filters

message Filter {
  enum Kind {
    ALL = 0;
    ERRORS = 1;
    SLOW = 2;
    PINNED = 3;
  }
  Kind kind = 1;
  // Free text. Plain words match host, path, headers and body text.
  // Operators: method:POST status:404 status:5xx host:example.com app:curl
  string text = 2;
  // Exact host names (case-insensitive); empty means every host. This is how
  // the app focuses on a host: unlike `host:` it never matches a longer name.
  repeated string hosts = 3;
  // Exact SDK device ids and app ids (the Devices filter chips); empty = all.
  repeated string devices = 4;
  repeated string apps = 5;
}

// ---------------------------------------------------------------- flows

enum FlowState {
  PENDING = 0;    // request seen, no response headers yet
  RECEIVING = 1;  // response headers in, body still streaming
  COMPLETE = 2;
  FAILED = 3;
}

// FlowSummary.flags bit values.
//   1 pinned        client rejected the minted certificate; host is tunneled
//   2 tunnel        CONNECT tunnel, not decrypted
//   4 error         transport or upstream failure
//   8 req_truncated request body hit the capture cap
//  16 res_truncated response body hit the capture cap
//  32 websocket     upgraded to WebSocket (frames are not captured yet)
//  64 mapped        answered from a Map Local rule, not by upstream
// 128 ssl_bypassed  tunneled untouched because the host is outside the SSL
//                   proxying list (or in its exclude list)
// 256 edited        a rule or a breakpoint edit changed the request or response
// 512 breakpoint    the flow was held at a breakpoint
// 1024 replayed     sent again by the proxy
// 16384 slow, 32768 possible duplicate, 65536 large payload,
// 131072 missing cache headers, 262144 possible N+1, 524288 sensitive data.
message FlowSummary {
  uint64 id = 1;
  int64 started_at_ms = 2;
  double duration_ms = 3;
  string scheme = 4;
  string host = 5;
  uint32 port = 6;
  string method = 7;
  string path = 8;  // path and query
  uint32 status = 9;
  string protocol = 10;  // "HTTP/1.1", "h2", "tunnel"
  string app = 11;
  uint64 req_size = 12;
  uint64 res_size = 13;
  FlowState state = 14;
  uint32 flags = 15;
  string content_type = 16;  // short form of the response type, e.g. "json"
  string error = 17;
  // In-app SDK context. Empty for proxy-only flows.
  FlowSource source = 18;
  uint64 merged_with = 19;  // the other half of a merged pair, 0 if none
  string device_id = 20;
  string app_id = 21;
  string name = 22;
  string tag = 23;
  string owner = 24;
  string screen = 25;
  string route_template = 26;
  string client_stack = 27;
  repeated string issue_labels = 28;
}

enum FlowSource {
  PROXY = 0;
  SDK = 1;
  MERGED = 2;  // an SDK record that also has a wire view (see FlowDetail.wire)
}

message Header {
  string name = 1;
  string value = 2;
}

message Timings {
  double dns_ms = 1;
  double connect_ms = 2;
  double tls_ms = 3;
  double send_ms = 4;
  double wait_ms = 5;  // time to first byte
  double receive_ms = 6;
  double total_ms = 7;
  bool reused_connection = 8;
}

enum BodyKind {
  EMPTY = 0;
  JSON = 1;
  TEXT = 2;
  FORM = 3;
  IMAGE = 4;
  BINARY = 5;
  HTML = 6;
}

enum JsonTokenKind {
  PUNCT = 0;
  KEY = 1;
  STRING = 2;
  NUMBER = 3;
  LITERAL = 4;  // true, false, null
}

message JsonToken {
  JsonTokenKind kind = 1;
  string text = 2;
}

// One printed line of a JSON document. Containers that span lines carry the
// index of their closing line in fold_end, so the UI can collapse them
// without parsing.
message JsonLine {
  uint32 depth = 1;
  repeated JsonToken tokens = 2;
  int32 fold_end = 3;  // -1 when the line is not a foldable opener
}

message FormField {
  string name = 1;
  string value = 2;
}

enum HtmlBlockKind {
  HTML_PARAGRAPH = 0;
  HTML_HEADING = 1;
  HTML_LIST_ITEM = 2;
  HTML_QUOTE = 3;
  HTML_CODE = 4;
  HTML_RULE = 5;
  HTML_IMAGE = 6;
}

// Inline run in a preview block. style bits: 1 bold, 2 italic, 4 code, 8 link.
// For images, text is the alt text and href the source.
message HtmlSpan {
  string text = 1;
  uint32 style = 2;
  string href = 3;
}

// A block of a simplified page preview. Scripts, styles and remote resources
// are never part of it.
message HtmlBlock {
  HtmlBlockKind kind = 1;
  uint32 level = 2;    // heading 1-6, list depth from 0, quote depth
  string marker = 3;   // list bullet or number
  repeated HtmlSpan spans = 4;
}

enum SourceTokenKind {
  SRC_PLAIN = 0;
  SRC_TAG = 1;
  SRC_ATTR = 2;
  SRC_VALUE = 3;
  SRC_COMMENT = 4;
  SRC_PUNCT = 5;
  SRC_ENTITY = 6;
}

message SourceToken {
  SourceTokenKind kind = 1;
  string text = 2;
}

// One display line of highlighted markup. Long minified lines are broken at
// tag boundaries; `BodyView.text` keeps the original bytes.
message SourceLine {
  repeated SourceToken tokens = 1;
}

message SseEvent {
  string event = 1;
  string id = 2;
  string data = 3;
  optional uint64 retry_ms = 4;
}

message BodyView {
  BodyKind kind = 1;
  string content_type = 2;
  string content_encoding = 3;
  uint64 wire_size = 4;
  uint64 decoded_size = 5;
  bool capture_truncated = 6;  // body was larger than the capture cap
  bool preview_truncated = 7;  // text or json cut for display
  string text = 8;             // utf-8 text (pretty printed for JSON)
  repeated JsonLine json = 9;
  repeated FormField form = 10;
  bytes image = 11;            // raw bytes for images up to 4 MiB
  string note = 12;            // decode problems, binary description
  repeated HtmlBlock html = 13;     // preview blocks for HTML
  string html_title = 14;
  repeated SourceLine source = 15;  // highlighted markup lines for HTML
  repeated SseEvent events = 16;
  ProtocolView protocol = 17;
}

// parts bit mask for GetFlowRequest.
//   1 overview      summary, headers, timings, url, curl
//   2 request body
//   4 response body
message GetFlowRequest {
  uint64 id = 1;
  uint32 parts = 2;
}

message FlowDetail {
  FlowSummary summary = 1;
  string url = 2;
  repeated Header request_headers = 3;
  repeated Header response_headers = 4;
  Timings timings = 5;
  string curl = 6;
  BodyView request_body = 7;
  BodyView response_body = 8;
  string dio = 30;
  repeated string issues = 31;
  SdkContext sdk = 9;     // set for SDK and merged flows
  FlowDetail wire = 10;   // set for merged flows: what the proxy saw
}

enum BodyState {
  BODY_PRESENT = 0;
  BODY_LAZY = 1;     // still on the device; fetch_body asks for it
  BODY_SKIPPED = 2;  // not captured by policy
  BODY_GONE = 3;     // was on the device, no longer
}

// What only the SDK knows about a call.
message SdkContext {
  string device_id = 1;
  string app_id = 2;
  string device_name = 3;
  string device_model = 4;
  string os_version = 5;
  string app_name = 6;
  string app_version = 7;
  string build = 8;
  string sdk_name = 9;
  string sdk_version = 10;
  string connection = 11;
  string name = 12;
  string owner = 13;
  string tag = 14;
  string screen = 15;
  string route_template = 16;
  string client_stack = 17;
  bool from_cache = 18;
  bool request_redacted = 19;
  bool response_redacted = 20;
  BodyState request_body_state = 21;
  BodyState response_body_state = 22;
  Timings timings = 23;  // as measured by the client stack; unknown parts are -1
}

// ---------------------------------------------------------------- subscribe

message SubscribeRequest {
  Filter filter = 1;
}
message SubscribeResponse {
  uint64 total = 1;  // flows currently stored
}
message UnsubscribeRequest {}
message UnsubscribeResponse {}

// Batched at 16 ms. Each flow appears at most once per batch (latest state).
message FlowBatch {
  repeated FlowSummary upserts = 1;
  bool cleared = 2;   // the store was cleared; drop everything
  uint64 total = 3;   // total stored flows after this batch
  // Rows that are no longer listed on their own (the wire half of an SDK and
  // proxy pair that was merged). Refresh the visible page.
  repeated uint64 removed = 4;
}

// The subscriber fell behind and events were dropped. Re-run search.
message Resync {}

// ---------------------------------------------------------------- search

message SearchRequest {
  Filter filter = 1;
  int64 since_ms = 2;  // 0 = no lower bound
  int64 until_ms = 3;  // 0 = no upper bound
  uint32 offset = 4;
  uint32 limit = 5;    // 0 = 200, capped at 1000
}
message SearchResponse {
  uint64 total = 1;
  uint32 offset = 2;
  repeated FlowSummary items = 3;
}

// ---------------------------------------------------------------- capture

message CaptureRequest {
  enum Action {
    STATUS = 0;
    START = 1;
    STOP = 2;
  }
  Action action = 1;
}
message CaptureStatus {
  bool recording = 1;
  uint64 flows = 2;
}

// ---------------------------------------------------------------- export

message ExportRequest {
  string kind = 1;            // "har"
  repeated uint64 ids = 2;    // empty = everything matching filter
  Filter filter = 3;
  bool redact = 4;            // strip Authorization, Cookie, tokens
}
message ExportResponse {
  bytes data = 1;
  string filename = 2;
  uint32 count = 3;
}

message ClearRequest {}
message ClearResponse {
  uint64 removed = 1;
}

// ---------------------------------------------------------------- status

message StatusRequest {}
message StatusResponse {
  string version = 1;
  string listen = 2;
  string data_dir = 3;
  uint64 uptime_ms = 4;
  uint64 flows = 5;
  bool recording = 6;
  repeated string pinned_hosts = 7;
  bool insecure_upstream = 8;
  uint32 core_pid = 9;
}

message CaInfoRequest {}
message CaInfo {
  string cert_path = 1;
  string sha256 = 2;
  string subject = 3;
  string not_after = 4;
  string pem = 5;
  string key_storage = 6;  // "keyring" or "file"
  string spki_sha256 = 7;  // base64 SHA-256 of the CA public key, for browser flags
}

// ---------------------------------------------------------------- hosts

message HostsRequest {
  uint32 limit = 1;  // 0 = 500, capped at 2000
}

// One host with stored traffic, newest activity first in the response.
message HostSummary {
  string host = 1;
  uint64 flows = 2;
  uint64 errors = 3;
  int64 last_started_ms = 4;
  bool pinned = 5;       // the client rejected our certificate; tunneled
  bool decrypted = 6;    // under the current SSL proxying rules, this host is decrypted
  bool tunnel_only = 7;  // every stored flow is an untouched tunnel
  uint64 mapped = 8;     // flows answered by a Map Local rule
}

message HostsResponse {
  repeated HostSummary hosts = 1;
}

// ---------------------------------------------------------------- rules

enum SslMode {
  SSL_ALL = 0;     // decrypt every host except the excluded ones
  SSL_LISTED = 1;  // decrypt only the listed hosts
}

// Host patterns: `example.com`, `*.example.com`, `api.example.com:8443`.
message SslSettings {
  SslMode mode = 1;
  repeated string hosts = 2;
  repeated string exclude = 3;
}

// Answer requests for one URL from a local file.
message MapLocalRule {
  string id = 1;            // empty on create; the core assigns one
  bool enabled = 2;
  string host = 3;          // pattern
  uint32 port = 4;          // 0 = any
  string path = 5;          // exact, or a prefix when it ends with *
  string query = 6;         // exact query string; empty = any
  string file = 7;          // absolute path, read on every request
  uint32 status = 8;        // 0 = 200
  string content_type = 9;  // empty = from the file extension
}

message RulesRequest {}
message RulesResponse {
  SslSettings ssl = 1;
  repeated MapLocalRule map_local = 2;
  repeated string pinned_hosts = 3;
  repeated Rule rules = 4;       // mock, map remote, rewrite, throttle, breakpoint
  McpWrites mcp_writes = 5;
}

message SetSslRequest {
  SslSettings ssl = 1;
}

// Decrypt or tunnel one host without touching the rest. Enabling also gives a
// pinned host another chance.
message SslHostRequest {
  string host = 1;
  bool enable = 2;
}

message PutMapLocalRequest {
  MapLocalRule rule = 1;
}

message RemoveRuleRequest {
  string id = 1;
}

// Forget that a host rejected our certificate. Empty host = all hosts.
message UnpinRequest {
  string host = 1;
}

// ---------------------------------------------------------------- rules v2

// Which requests a rule applies to. Empty fields match anything.
message RuleMatch {
  string scheme = 1;   // "http", "https" or empty
  string host = 2;     // pattern, * for any
  uint32 port = 3;     // 0 = any
  string method = 4;
  string path = 5;     // exact, or a prefix when it ends with *
  string query = 6;    // exact query string
}

message HeaderEdit {
  enum Op {
    SET = 0;
    ADD = 1;
    REMOVE = 2;
  }
  Op op = 1;
  string name = 2;
  string value = 3;
}

// Answer with a fixed response; the server is never contacted.
message MockAction {
  uint32 status = 1;
  repeated Header headers = 2;
  string body = 3;
  uint32 delay_ms = 4;
}

// Send the request to another host, port or scheme.
message MapRemoteAction {
  string scheme = 1;
  string host = 2;
  uint32 port = 3;
}

message RewriteAction {
  repeated HeaderEdit request_headers = 1;
  repeated HeaderEdit response_headers = 2;
}

message ThrottleAction {
  uint32 delay_ms = 1;
}

message BreakpointAction {
  enum Phase {
    BOTH = 0;
    REQUEST = 1;
    RESPONSE = 2;
  }
  Phase phase = 1;
  uint32 timeout_s = 2;  // 0 = 60
}

message Rule {
  string id = 1;  // empty on create; the core assigns one
  string name = 2;
  bool enabled = 3;
  RuleMatch matcher = 4;
  oneof action {
    MockAction mock = 10;
    MapRemoteAction map_remote = 11;
    RewriteAction rewrite = 12;
    ThrottleAction throttle = 13;
    BreakpointAction breakpoint = 14;
    ScenarioAction scenario = 15;
  }
}

message PutRuleRequest {
  Rule rule = 1;
}

// Turn any rule (Map Local included) on or off.
message SetRuleEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

// ---------------------------------------------------------------- breakpoints

enum MessagePhase {
  PHASE_REQUEST = 0;
  PHASE_RESPONSE = 1;
}

// A request or response held at a breakpoint. Compressed bodies are shown
// decompressed and the content-encoding header is dropped.
message PausedFlow {
  uint64 flow_id = 1;
  string rule_id = 2;
  MessagePhase phase = 3;
  FlowSummary summary = 4;
  string method = 5;
  string path = 6;    // request: path and query
  uint32 status = 7;  // response
  repeated Header headers = 8;
  bytes body = 9;
  int64 since_ms = 10;
  uint32 timeout_s = 11;
}

message ListPausedRequest {}
message PausedList {
  repeated PausedFlow items = 1;
}

// Resume a held message, with edits, or abort it. Unset fields keep the
// original. `replace_headers` swaps the whole header list for `headers`.
message ResumeRequest {
  uint64 flow_id = 1;
  bool abort = 2;
  string abort_reason = 3;
  optional string method = 4;
  optional string path = 5;
  optional uint32 status = 6;
  bool replace_headers = 7;
  repeated Header headers = 8;
  optional bytes body = 9;
}

// Pushed (id = 0) to connections that sent `watch`.
message PauseNotice {
  PausedFlow paused = 1;       // set when a message was just held
  uint64 released_flow_id = 2; // set when one went on its way
  string how = 3;              // resumed, edited, aborted, timeout, gone
}

// ---------------------------------------------------------------- replay

// Send a captured flow again. Edits apply to the copy; unset fields keep the
// original. The result is a new flow that bypasses rules and breakpoints.
message ReplayRequest {
  uint64 id = 1;
  optional string method = 2;
  optional string url = 3;
  bool replace_headers = 4;
  repeated Header headers = 5;
  optional bytes body = 6;
}

message ReplayResponse {
  uint64 flow_id = 1;
  uint32 status = 2;
}

// ---------------------------------------------------------------- AI clients

// Start receiving pushed PauseNotice and ApprovalNotice messages.
message WatchRequest {}

enum McpWrites {
  MCP_ASK = 0;   // every change waits for approval in the app
  MCP_AUTO = 1;  // changes apply at once
  MCP_OFF = 2;   // read only
}

message SetMcpWritesRequest {
  McpWrites writes = 1;
}

message McpInfoRequest {}

// How to connect a local AI client.
message McpInfo {
  bool enabled = 1;
  string url = 2;      // http://127.0.0.1:8898/mcp
  string token = 3;
  string command = 4;  // ready-to-run `claude mcp add ...`
  McpWrites writes = 5;
}

// A change an AI client wants to make, waiting for a person.
message Approval {
  string id = 1;
  string tool = 2;
  string title = 3;
  string detail = 4;  // pretty JSON of the arguments
  int64 requested_ms = 5;
}

message ListApprovalsRequest {}
message ApprovalsResponse {
  repeated Approval pending = 1;
}

message DecideApprovalRequest {
  string id = 1;
  bool allow = 2;
}

// Pushed (id = 0) to connections that sent `watch`.
message ApprovalNotice {
  Approval requested = 1;  // set when a new one is waiting
  string decided_id = 2;   // set when one was answered or expired
  bool allowed = 3;
}

// ---------------------------------------------------------------- in-app SDK

message SdkStatusRequest {}
message SdkSetEnabledRequest {
  bool enabled = 1;
}
message RegenerateSdkCertRequest {}

// Remembered across restarts. The answer is the new SdkStatus.
message SdkSetSettingsRequest {
  bool enabled = 1;
  bool lan = 2;
  bool auto_accept_local = 3;
}
message OkResponse {}

message SdkStats {
  uint64 calls = 1;
  uint64 events = 2;
  uint64 dropped_chunks = 3;
  uint64 dropped_calls = 4;
  uint64 dropped_events = 5;
  uint64 protocol_violations = 6;
  uint64 rejected_connections = 7;
  uint64 incomplete_calls = 8;
}

message SdkStatus {
  bool available = 1;      // false if this core was built or started without the SDK listener
  bool enabled = 2;
  uint32 port = 3;
  string fingerprint = 4;  // SHA-256 of the ingest certificate, hex
  string desktop_name = 5;
  repeated string listening = 6;      // "192.168.1.24:8897"
  repeated string lan_addresses = 7;
  string adb_state = 8;    // off | unavailable | ready | error
  string adb_label = 9;    // "adb ready, 1 device(s)"
  repeated string adb_devices = 10;
  string discovery_state = 11;  // off | advertising | error
  string discovery_error = 12;
  uint32 sessions = 13;
  SdkStats stats = 14;
  bool lan = 15;                // also listening on the network, so phones on Wi-Fi find this computer
  bool auto_accept_local = 16;  // connections from this computer (USB, emulator, simulator) skip the prompt
  string health = 17;           // off | ok | attention | problem: can an app connect right now
  repeated SdkCheck checks = 18;
}

// One thing that decides whether an app can connect, and how to fix it when it does not.
message SdkCheck {
  string id = 1;      // listener | settings | auto-accept | adb | wifi | firewall | discovery | pending
  string level = 2;   // ok | info | warn | error
  string title = 3;
  string detail = 4;
  string fix = 5;     // empty when nothing is needed
}

message DevicesSubscribeRequest {}

enum DeviceStatus {
  DEVICE_IDLE = 0;
  DEVICE_CONNECTED = 1;
  DEVICE_DENIED = 2;
  DEVICE_REVOKED = 3;
}

enum Redaction {
  REDACT_DEFAULT = 0;
  REDACT_STRICT = 1;
  REDACT_NONE = 2;
}

message DeviceConfig {
  bool capture_enabled = 1;
  repeated string host_allow = 2;
  repeated string host_deny = 3;
  uint32 body_cap_bytes = 4;
  uint32 eager_body_bytes = 5;
  Redaction redaction = 6;
  repeated string extra_redact_keys = 7;
}

message Device {
  string device_id = 1;
  string app_id = 2;
  string device_name = 3;
  string device_model = 4;
  string os_version = 5;
  string app_name = 6;
  string app_version = 7;
  string sdk_name = 8;
  string sdk_version = 9;
  DeviceStatus status = 10;
  string connection = 11;  // emulator | usb | wifi | simulator
  string remote_ip = 12;
  int64 last_seen_ms = 13;
  uint64 flows = 14;
  uint64 dropped = 15;
  DeviceConfig config = 16;
}

message PendingPrompt {
  uint64 id = 1;
  string device_id = 2;
  string app_id = 3;
  string device_name = 4;
  string device_model = 5;
  string os_version = 6;
  string app_name = 7;
  string sdk_name = 8;
  string sdk_version = 9;
  string connection = 10;
  string remote_ip = 11;
  string code = 12;        // six digits; the app shows it as "482 913"
  int64 created_ms = 13;
  int64 expires_ms = 14;
  bool repair = 15;
}

// The answer to devices_subscribe, then pushed (id = 0) on every change.
message DevicesSnapshot {
  uint64 rev = 1;
  bool enabled = 2;
  repeated Device devices = 3;
  repeated PendingPrompt pending = 4;
}

message DeviceActionRequest {
  enum Kind {
    ALLOW = 0;   // pending_id
    DENY = 1;    // pending_id
    REVOKE = 2;  // device_id + app_id
    FORGET = 3;  // device_id (all its apps)
  }
  Kind kind = 1;
  uint64 pending_id = 2;
  string device_id = 3;
  string app_id = 4;
}

message SetDeviceConfigRequest {
  string device_id = 1;
  string app_id = 2;
  DeviceConfig config = 3;
}

// Ask the device for a body it kept (BODY_LAZY). Answers with the flow again.
message FetchBodyRequest {
  uint64 flow_id = 1;
  bool response = 2;  // false = request body
}

message ImportHarRequest { bytes data = 1; }
message ImportHarResponse { repeated uint64 ids = 1; uint32 count = 2; }

message DecodedField { uint32 depth = 1; string label = 2; string value = 3; }
message ProtocolView { string title = 1; repeated DecodedField fields = 2; string note = 3; }

message ScenarioAction { uint32 fail_one_in = 1; uint32 delay_ms = 2; uint32 jitter_ms = 3; uint32 flaky_one_in = 4; }
