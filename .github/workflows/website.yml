name: website

# Builds the SvelteKit site in website/ and publishes it to GitHub Pages.
# Enable Pages with source "GitHub Actions" in the repo settings first.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build
        working-directory: website
        env:
          # The project site lives under /<repo>, e.g. /neko-proxy
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - id: deployment
        uses: actions/deploy-pages@v4
