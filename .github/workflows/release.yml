name: release

# Tag vX.Y.Z (matching Cargo.toml) to build packages and open a DRAFT release.
# Nothing is published until you press "Publish release" in GitHub.
# Run by hand (workflow_dispatch) to build the packages as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned and checksummed: appimagetool 1.9.1.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1
  APPIMAGETOOL_SHA256_X86_64: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGETOOL_SHA256_AARCH64: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version v$v"; exit 1; }
      # The desktop render tests need a GPU adapter, which hosted runners lack;
      # they run locally (`cargo test -p neko-desktop`).
      - run: cargo test --workspace --exclude neko-desktop
      - run: cargo test -p neko-desktop -- --skip visual --skip e2e

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) keeps the glibc floor low so the binaries run on
          # Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+.
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools for rpm and AppImage
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm binutils

      - name: Fetch appimagetool (pinned, checksummed)
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ]; then sum=$APPIMAGETOOL_SHA256_X86_64; else sum=$APPIMAGETOOL_SHA256_AARCH64; fi
          f=appimagetool-${{ matrix.arch }}.AppImage
          curl -fsSL -o "$RUNNER_TEMP/$f" "$APPIMAGETOOL_URL/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$f"
          echo "APPIMAGETOOL=$RUNNER_TEMP/$f" >> "$GITHUB_ENV"

      - name: Build packages
        run: packaging/build.sh

      - name: Smoke test the tarball install
        run: |
          sh packaging/install.sh --tarball dist/neko-*-linux-${{ matrix.arch }}.tar.gz --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/nekod" --help

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  macos:
    needs: test
    runs-on: macos-15
    # Signed with a Developer ID and notarized when these secrets are set (see
    # docs/macos-signing.md); otherwise ad-hoc signed, and the first launch needs
    # System Settings > Privacy & Security > Open Anyway.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets for a universal build
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Developer ID certificate and notary credentials
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          KC_PASS=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KC" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$ID" ] || { echo "no Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          xcrun notarytool store-credentials neko-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KC"
          {
            echo "SIGN_IDENTITY=$ID"
            echo "NOTARY_PROFILE=neko-notary"
            echo "NOTARY_KEYCHAIN=$KC"
          } >> "$GITHUB_ENV"
      - name: Build Neko.app and the disk image
        env:
          UNIVERSAL: "1"
        run: packaging/macos/build.sh
      - name: Smoke test
        run: |
          dist/Neko.app/Contents/MacOS/nekod --help
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            spctl --assess --type execute -v dist/Neko.app
            xcrun stapler validate dist/*.dmg
          fi
      - name: Remove the signing keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          if-no-files-found: error
          path: dist/*.dmg

  release:
    needs: [package, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: packages-*
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "${GITHUB_REF_NAME}" *
