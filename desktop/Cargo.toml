[package]
name = "neko-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Linux desktop app for Neko Proxy"
default-run = "neko"

[[bin]]
name = "neko"
path = "src/main.rs"

[dependencies]
proto.workspace = true
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
anyhow.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
