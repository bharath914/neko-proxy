[package]
name = "proxy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "io-util", "time", "macros"] }
flow = { path = "../crates/flow" }
proxy-tls = { path = "../crates/tls" }
proxy-net = { path = "../crates/net" }
proxy-decode = { path = "../crates/decode" }
tempfile = "3"

[workspace]

[[bin]]
name = "http_parse"
path = "fuzz_targets/http_parse.rs"
test = false
doc = false

[[bin]]
name = "decode_body"
path = "fuzz_targets/decode_body.rs"
test = false
doc = false
